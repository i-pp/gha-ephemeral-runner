name: Offline tests

on:
  push:
    branches: [main, 'dev/**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  offline:
    name: Minimum CI
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Test setup
        run: python3 -I -B -m unittest discover -s tests -v
      - name: Test queue and local admission
        working-directory: queue-pilot
        run: python3 -B -m unittest discover -v
